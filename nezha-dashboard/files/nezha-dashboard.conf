config nezha_dashboard 'main'
	option enabled '0'
	# working dir; config.yaml and sqlite.db live in <data_dir>/data/
	# (SQLite writes often; /etc lives on flash)
	option data_dir '/etc/nezha-dashboard'
	# empty = all interfaces
	option listen_host ''
	# web panel AND agent connections share this port
	option listen_port '8008'
	# "host:port" shown in the agent install command, e.g. ddns.example.com:8008
	option install_host ''
	option location 'Asia/Shanghai'
	option language 'zh_CN'
	# add a firewall rule allowing WAN access to listen_port
	option open_wan '0'
