name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      commit_message: ${{ steps.commit.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: echo "release_tag=nezha-dashboard-$(date -u +%Y.%m.%d)-r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve commit message
        id: commit
        run: |
          {
            echo "message<<COMMIT_MSG_EOF"
            git log -1 --pretty=%B
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

  build-nezha-dashboard:
    name: Build nezha-dashboard (${{ matrix.platform_name }}, ${{ matrix.pkg_format }})
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ARM64
            pkg_format: apk
            arch_suffix: arm64
            sdk_base: snapshots
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
          - platform_name: AMD64
            pkg_format: apk
            arch_suffix: x86_64
            sdk_base: snapshots
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'
          - platform_name: ARM64
            pkg_format: ipk
            arch_suffix: arm64
            sdk_base: releases/24.10.6
            sdk_path: qualcommax/ipq807x
            sdk_prefix: immortalwrt-sdk-24.10.6-qualcommax-ipq807x_gcc-13.3.0_
            target: qualcommax
            subtarget: ipq807x
          - platform_name: AMD64
            pkg_format: ipk
            arch_suffix: x86_64
            sdk_base: releases/24.10.6
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_
            target: x86
            subtarget: '64'

    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/${{ matrix.sdk_base }}/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip xsltproc zip zlib1g-dev zstd

      - name: Locate SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"

          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"

          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Download SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          archive="$RUNNER_TEMP/sdk/$SDK_ARCHIVE"

          curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive"
          echo "$SDK_SHA256  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/sdk-root"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/sdk-root"
          echo "SDK_ROOT=$(find "$RUNNER_TEMP/sdk-root" -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Prepare packages
        run: |
          rm -rf "$SDK_ROOT/package/nezha-dashboard"
          cp -a nezha-dashboard "$SDK_ROOT/package/nezha-dashboard"
          rm -rf "$SDK_ROOT/package/luci-app-nezha-dashboard"
          cp -a luci-app-nezha-dashboard "$SDK_ROOT/package/luci-app-nezha-dashboard"

      - name: Update and install feeds
        run: |
          "$SDK_ROOT/scripts/feeds" update -a
          "$SDK_ROOT/scripts/feeds" install -a

      - name: Configure packages
        run: |
          cat > "$SDK_ROOT/.config" <<EOF
          CONFIG_TARGET_${{ matrix.target }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_PACKAGE_nezha-dashboard=m
          CONFIG_PACKAGE_luci-app-nezha-dashboard=m
          CONFIG_PACKAGE_luci-i18n-nezha-dashboard-zh-cn=m
          EOF

          make -C "$SDK_ROOT" defconfig

      - name: Compile packages
        run: |
          make -C "$SDK_ROOT" package/nezha-dashboard/clean
          make -C "$SDK_ROOT" -j"$(nproc)" \
            package/nezha-dashboard/compile \
            package/luci-app-nezha-dashboard/compile || \
            make -C "$SDK_ROOT" -j1 \
              package/nezha-dashboard/compile \
              package/luci-app-nezha-dashboard/compile V=s

      - name: Collect packages
        env:
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          PKG_FORMAT: ${{ matrix.pkg_format }}
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          nezha_found=0
          luci_found=0
          i18n_found=0

          if [[ "$PKG_FORMAT" == "apk" ]]; then
            while IFS= read -r -d '' apk; do
              metadata="$("$SDK_ROOT/staging_dir/host/bin/apk" adbdump "$apk")"
              name="$(awk '/^  name: / { sub(/^  name: /, ""); print; exit }' <<< "$metadata")"

              case "$name" in
                nezha-dashboard)
                  base="$(basename "$apk")"
                  version_part="${base#nezha-dashboard-}"
                  version_part="${version_part%.apk}"
                  cp -p "$apk" "$RUNNER_TEMP/output/nezha-dashboard_${ARCH_SUFFIX}-${version_part}.apk"
                  nezha_found=$((nezha_found + 1))
                  ;;
                luci-app-nezha-dashboard)
                  base="$(basename "$apk")"
                  version_part="${base#luci-app-nezha-dashboard-}"
                  version_part="${version_part%.apk}"
                  cp -p "$apk" "$RUNNER_TEMP/output/luci-app-nezha-dashboard-${version_part}.apk"
                  luci_found=$((luci_found + 1))
                  ;;
                luci-i18n-nezha-dashboard-zh-cn)
                  base="$(basename "$apk")"
                  version_part="${base#luci-i18n-nezha-dashboard-zh-cn-}"
                  version_part="${version_part%.apk}"
                  cp -p "$apk" "$RUNNER_TEMP/output/luci-i18n-nezha-dashboard-zh-cn-${version_part}.apk"
                  i18n_found=$((i18n_found + 1))
                  ;;
              esac
            done < <(find "$SDK_ROOT/bin" -type f \
              \( -name 'nezha-dashboard-*.apk' \
                 -o -name 'luci-app-nezha-dashboard-*.apk' \
                 -o -name 'luci-i18n-nezha-dashboard-zh-cn-*.apk' \) -print0)

            [[ "$nezha_found" -eq 1 ]]
            [[ "$luci_found" -ge 1 ]]
            [[ "$i18n_found" -ge 1 ]]
          else
            while IFS= read -r -d '' ipk; do
              control_dir="$(mktemp -d)"
              (
                cd "$control_dir" || exit 1
                if tar -tzf "$ipk" >/dev/null 2>&1; then
                  tar -xzf "$ipk"
                else
                  ar x "$ipk"
                fi
                tar -xzf control.tar.gz 2>/dev/null || true
              )
              name="$(awk -F': ' '/^Package:/ { print $2; exit }' "$control_dir/control" 2>/dev/null)"
              rm -rf "$control_dir"

              case "$name" in
                nezha-dashboard)
                  base="$(basename "$ipk")"
                  version_part="${base#nezha-dashboard_}"
                  version_part="${version_part%%_*}"
                  cp -p "$ipk" "$RUNNER_TEMP/output/nezha-dashboard_${ARCH_SUFFIX}-${version_part}.ipk"
                  nezha_found=$((nezha_found + 1))
                  ;;
                luci-app-nezha-dashboard)
                  base="$(basename "$ipk")"
                  version_part="${base#luci-app-nezha-dashboard_}"
                  version_part="${version_part%%_*}"
                  cp -p "$ipk" "$RUNNER_TEMP/output/luci-app-nezha-dashboard_${version_part}.ipk"
                  luci_found=$((luci_found + 1))
                  ;;
                luci-i18n-nezha-dashboard-zh-cn)
                  base="$(basename "$ipk")"
                  version_part="${base#luci-i18n-nezha-dashboard-zh-cn_}"
                  version_part="${version_part%%_*}"
                  cp -p "$ipk" "$RUNNER_TEMP/output/luci-i18n-nezha-dashboard-zh-cn_${version_part}.ipk"
                  i18n_found=$((i18n_found + 1))
                  ;;
              esac
            done < <(find "$SDK_ROOT/bin" -type f \
              \( -name 'nezha-dashboard_*.ipk' \
                 -o -name 'luci-app-nezha-dashboard_*.ipk' \
                 -o -name 'luci-i18n-nezha-dashboard-zh-cn_*.ipk' \) -print0)

            [[ "$nezha_found" -ge 1 ]]
            [[ "$luci_found" -ge 1 ]]
            [[ "$i18n_found" -ge 1 ]]
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nezha-dashboard-${{ matrix.pkg_format }}-${{ matrix.platform_name }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [tag, build-nezha-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Flatten packages
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -print0 | while IFS= read -r -d '' f; do
            cp -f "$f" "$RUNNER_TEMP/release/"
          done

          echo "=== SHA256SUMS (log only, not published to the release) ==="
          cd "$RUNNER_TEMP/release"
          sha256sum -- *

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.release_tag }}
          TITLE: ${{ needs.tag.outputs.release_tag }}
          NOTES: ${{ needs.tag.outputs.commit_message }}
        run: |
          cd "$RUNNER_TEMP/release"

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.txt"

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            -- * \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
